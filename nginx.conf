# Serves the couple/friends intake SPA inside this image.
#
# The bundle lives under /guest/ so it cannot collide with the DJ app's
# /assets/ on the same hostname; the magic link the couple actually opens is
# /g/<token>, which is answered with the same index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container health check — never reaches the SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed bundle files: safe to cache forever.
    location /guest/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every magic link renders the same SPA; the client reads the token from
    # the URL. The token is a secret in that URL, so this page must not leak
    # it onward in a Referer header, and must not be cached by a shared proxy.
    location /g/ {
        try_files /guest/index.html =404;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /guest/ {
        try_files $uri /guest/index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
